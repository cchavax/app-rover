name: CI

on:
  # Todas las ramas: así una rama de prueba se valida antes de pasarla a main.
  push:
  pull_request:

jobs:
  base-de-datos:
    name: Tests de permisos (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente de Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migraciones + tests
        run: |
          ./supabase/tests/run-local.sh | tee salida.txt
          # run-local.sh corta con error si un test falla; además contamos los que pasaron.
          echo "### $(grep -c '^  ok' salida.txt) tests de permisos pasaron ✅" >> "$GITHUB_STEP_SUMMARY"

  app:
    name: Compilar la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: TypeScript + build
        run: npm run build
